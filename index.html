<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Air Quality App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        background: linear-gradient(to right, #83a4d4, #b6fbff);
        min-height: 100vh;
      }
      .card {
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      }
      #aqiValue {
        font-size: 2rem;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <h1 class="text-center mb-4 text-dark fw-bold">🌦️ Air Quality Checker</h1>

      <div class="card p-4 mx-auto" style="max-width: 600px;">
        <div class="mb-3">
          <label for="cityInput" class="form-label fw-semibold">Enter City</label>
          <input type="text" class="form-control" id="cityInput" placeholder="e.g. Delhi">
        </div>
        <button id="checkBtn" class="btn btn-primary w-100 mb-3">Check Air Quality</button>

        <div id="loading" class="text-center text-muted d-none">⏳ Fetching data...</div>

        <div id="result" class="text-center d-none">
          <h3 id="cityName" class="fw-bold mb-3"></h3>
          <div class="p-3 rounded bg-light">
            <p>AQI (Air Quality Index): <span id="aqiValue"></span></p>
            <p><strong>CO:</strong> <span id="co"></span></p>
            <p><strong>NO₂:</strong> <span id="no2"></span></p>
            <p><strong>O₃:</strong> <span id="o3"></span></p>
            <p><strong>PM2.5:</strong> <span id="pm25"></span></p>
            <p><strong>SO₂:</strong> <span id="so2"></span></p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
